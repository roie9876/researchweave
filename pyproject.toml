[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchweave"
version = "0.1.0"
description = "Autonomous Scientific & Engineering Research Platform on Azure with a persistent Company Brain"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "ResearchWeave Contributors" }
]
dependencies = [
  "pydantic>=2.7.0",
  "azure-identity>=1.17.0",
  "azure-storage-blob>=12.20.0",
  "openai>=1.50.0",
  "agentscope>=2.0.0",
]

[project.scripts]
researchweave = "researchweave.server:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchweave = ["static/*.html"]
